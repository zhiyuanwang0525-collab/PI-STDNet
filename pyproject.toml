[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pistdnet"
version = "0.1.0"
description = "Research implementation of PI-STDNet for TorNet tornado detection."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"

[tool.setuptools.packages.find]
where = ["src"]
